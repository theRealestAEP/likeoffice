name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          path: likeoffice

      - uses: actions/checkout@v4
        with:
          repository: theRealestAEP/wordinweb
          ref: likeoffice
          path: wordinweb-likeoffice

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the engine
        working-directory: wordinweb-likeoffice
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install the app
        working-directory: likeoffice
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        working-directory: likeoffice
        run: |
          npm run typecheck
          npm run build

      - name: E2E (Electron under Xvfb)
        working-directory: likeoffice
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a npx playwright test

      # Playwright writes a DOM snapshot per failure (error-context.md). Without
      # this they die with the runner, and a CI-only failure has to be guessed
      # at from the console log — which is exactly what happened to the
      # ai-transcript timeout.
      - name: Upload the failure snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: likeoffice/test-results/**
          if-no-files-found: ignore
          retention-days: 7
