name: Release

# Tag a commit `v*` (e.g. v0.1.0) to build installers for every platform and
# collect them into ONE draft GitHub Release. A human smoke-tests the draft and
# publishes it by hand. See RELEASING.md.
#
# Same shape as main-build.yml, and for the same reason: every leg builds with
# `--publish never` and uploads artifacts, then a SINGLE publish job creates the
# release. Letting each leg publish itself raced — four runners each tried to
# create the v0.1.0 draft, two of them won, and the tag ended up with two
# separate drafts holding 7 and 8 artifacts, neither complete. One publisher
# also means the two macOS legs' update feeds get merged rather than one
# overwriting the other (#144).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds on a runner of its OWN architecture. npm installs the
          # optional dependency matching the build host, and electron-builder
          # packs whatever is in node_modules regardless of --arch, so one
          # runner cannot honestly produce both (#142): building x64 on Apple
          # silicon shipped an Intel dmg carrying an arm64 `claude` binary.
          - os: macos-latest
            id: mac-arm64
            args: --mac --arm64
          # macos-15-intel, NOT macos-13: that label is retired, and GitHub
          # names macos-15-intel the last x86_64 Actions image, available until
          # August 2027. macos-latest is Apple silicon (macOS 26 arm64).
          - os: macos-15-intel
            id: mac-x64
            args: --mac --x64
          - os: ubuntu-latest
            id: linux
            args: --linux
          - os: windows-latest
            id: windows
            args: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          path: likeoffice

      # The engine is a sibling repo linked via file: dependencies
      # (apps/desktop -> ../../../wordinweb-likeoffice/packages/*), so it
      # must be cloned and built before the app installs.
      #
      # Cloned at the BRANCH here, then pinned below. A branch is a moving
      # target: on its own it means the same app tag can build different
      # binaries on different days, which is tolerable for a nightly and not
      # for a release.
      - uses: actions/checkout@v4
        with:
          repository: theRealestAEP/wordinweb
          ref: likeoffice
          path: wordinweb-likeoffice
          # Full history, so .engine-ref can name any commit, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pin the engine for a TAGGED build.
      #
      # Write the engine commit into `.engine-ref` in this repo (one line, a
      # full 40-char sha) and a tag rebuilds against exactly that engine,
      # today or in a year. With no such file the build falls back to the
      # branch tip and says so — which keeps this workflow working unchanged,
      # but leaves the release unreproducible. Write the file before tagging.
      - name: Pin the engine
        id: engine
        shell: bash
        run: |
          REF_FILE=likeoffice/.engine-ref
          if [ -s "$REF_FILE" ]; then
            PIN=$(tr -d '[:space:]' < "$REF_FILE")
            git -C wordinweb-likeoffice checkout --quiet "$PIN"
            PINNED="yes, from .engine-ref"
          else
            echo "::warning::No .engine-ref — building against the tip of wordinweb@likeoffice, so this release is NOT reproducible."
            PINNED="NO — built against the branch tip"
          fi
          SHA=$(git -C wordinweb-likeoffice rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Engine commit \`$SHA\` (pinned: $PINNED)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the engine
        working-directory: wordinweb-likeoffice
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install the app
        working-directory: likeoffice
        run: npm install --no-audit --no-fund

      - name: Build installers
        working-directory: likeoffice/apps/desktop
        # bash on every platform: the Windows runner defaults to PowerShell,
        # which cannot parse the POSIX test below and fails before building.
        shell: bash
        env:
          # Code signing is optional: with these secrets unset the builds
          # are unsigned. See RELEASING.md for how to enable signing.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An unset secret still DEFINES the variable, as empty. electron-builder
          # reads an empty CSC_LINK as a certificate path, resolves it against the
          # working directory, and dies with "<cwd> not a file" — which is what
          # broke the first v0.1.0 tag while the nightly, which never sets these
          # at all, built the same commit fine. Empty means absent, so remove them.
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          if [ -z "${APPLE_ID:-}" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run build
          npx electron-builder ${{ matrix.args }} --publish never

      - name: Stage the installers
        shell: bash
        run: |
          mkdir -p staged
          cd likeoffice/apps/desktop/release
          # Only the files a user downloads, plus the updater metadata.
          for f in *.dmg *.zip *.exe *.AppImage *.deb *.yml *.blockmap; do
            [ -e "$f" ] && cp "$f" "$GITHUB_WORKSPACE/staged/" || true
          done
          ls -la "$GITHUB_WORKSPACE/staged"

      - uses: actions/upload-artifact@v4
        with:
          # Per-leg names: the two mac legs both produce latest-mac.yml, and a
          # flat merge would silently keep one of them. They are merged
          # deliberately in the publish job instead.
          name: release-${{ matrix.id }}
          path: staged/*
          if-no-files-found: error
          retention-days: 7

    outputs:
      engine_sha: ${{ steps.engine.outputs.sha }}

  publish:
    # ONE job creates the release, AFTER every platform is in hand. This is the
    # whole point of the restructure: four legs publishing themselves produced
    # two drafts for one tag, split 7 and 8 artifacts, neither complete.
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # NOT merge-multiple: the per-leg directories are what make the
      # latest-mac.yml collision visible instead of silent.
      - uses: actions/download-artifact@v4
        with:
          path: legs

      - name: Collect the artifacts, merging the two mac update feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Everything except latest-mac.yml flattens with no conflict: each
          # leg produces differently named installers.
          find legs -type f ! -name latest-mac.yml -exec cp {} dist/ \;
          # No pip install: ubuntu-latest marks the system Python externally
          # managed (PEP 668). The script needs only the standard library, and
          # finds the feeds itself so this step stays plain enough to run
          # anywhere.
          python3 scripts/merge-mac-feeds.py dist/latest-mac.yml legs
          ls -la dist

      - name: Write the release notes
        shell: bash
        run: |
          {
            echo "## LikeOffice ${GITHUB_REF_NAME}"
            echo
            echo "Engine: \`${ENGINE_SHA:0:7}\` (\`theRealestAEP/wordinweb\`)."
            echo
            echo "> [!NOTE]"
            echo "> These builds are unsigned. macOS and Windows both warn on first"
            echo "> launch — see the README for the one-time step."
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in dist/*; do
              case "$f" in *.yml|*.blockmap) continue ;; esac
              [ -f "$f" ] || continue
              # Decimal MB, which is what the GitHub download page shows.
              printf '| `%s` | %s MB |\n' "$(basename "$f")" \
                "$(awk -v b="$(wc -c < "$f")" 'BEGIN{printf "%.1f", b/1000000}')"
            done
          } > notes.md
          cat notes.md
        env:
          ENGINE_SHA: ${{ needs.build.outputs.engine_sha }}

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # DRAFT on purpose: a human smoke-tests the installers and presses
          # publish. Auto-update only ever sees published releases.
          #
          # No delete-then-create here, unlike the rolling nightly. If a
          # release already exists for this tag the command fails, which is the
          # correct outcome for a stable tag — clobbering a release someone may
          # already have published is not something a re-run should do quietly.
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "LikeOffice $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*
