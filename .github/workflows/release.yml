name: Release

# Tag a commit `v*` (e.g. v0.1.0) to build installers for all three
# platforms and upload them to a draft GitHub Release. Publish the draft by
# hand after a smoke test. See RELEASING.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          path: likeoffice

      # The engine is a sibling repo linked via file: dependencies
      # (apps/desktop -> ../../../wordinweb-likeoffice/packages/*), so it
      # must be cloned and built before the app installs.
      #
      # Cloned at the BRANCH here, then pinned below. A branch is a moving
      # target: on its own it means the same app tag can build different
      # binaries on different days, which is tolerable for a nightly and not
      # for a release.
      - uses: actions/checkout@v4
        with:
          repository: theRealestAEP/wordinweb
          ref: likeoffice
          path: wordinweb-likeoffice
          # Full history, so .engine-ref can name any commit, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pin the engine for a TAGGED build.
      #
      # Write the engine commit into `.engine-ref` in this repo (one line, a
      # full 40-char sha) and a tag rebuilds against exactly that engine,
      # today or in a year. With no such file the build falls back to the
      # branch tip and says so — which keeps this workflow working unchanged,
      # but leaves the release unreproducible. Write the file before tagging.
      - name: Pin the engine
        id: engine
        shell: bash
        run: |
          REF_FILE=likeoffice/.engine-ref
          if [ -s "$REF_FILE" ]; then
            PIN=$(tr -d '[:space:]' < "$REF_FILE")
            git -C wordinweb-likeoffice checkout --quiet "$PIN"
            PINNED="yes, from .engine-ref"
          else
            echo "::warning::No .engine-ref — building against the tip of wordinweb@likeoffice, so this release is NOT reproducible."
            PINNED="NO — built against the branch tip"
          fi
          SHA=$(git -C wordinweb-likeoffice rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Engine commit \`$SHA\` (pinned: $PINNED)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the engine
        working-directory: wordinweb-likeoffice
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install the app
        working-directory: likeoffice
        run: npm install --no-audit --no-fund

      - name: Build and publish installers to a draft release
        working-directory: likeoffice/apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing is optional: with these secrets unset the builds
          # are unsigned. See RELEASING.md for how to enable signing.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          npx electron-builder ${{ matrix.args }} --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            likeoffice/apps/desktop/release/*.dmg
            likeoffice/apps/desktop/release/*.zip
            likeoffice/apps/desktop/release/*.exe
            likeoffice/apps/desktop/release/*.AppImage
            likeoffice/apps/desktop/release/*.deb
            likeoffice/apps/desktop/release/*.yml
            likeoffice/apps/desktop/release/*.blockmap
          if-no-files-found: error
