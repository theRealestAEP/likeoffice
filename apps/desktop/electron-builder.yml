# Packaging config for LikeOffice.
#
# The app ships the electron-vite output (out/) plus resources/. The renderer
# bundle is self-contained: Vite inlines the file:-linked engine packages
# (wordinweb, @wordinweb/agent), so they live in devDependencies and are
# never collected into the asar. Only the runtime dependencies of the main
# process (@anthropic-ai/sdk, @anthropic-ai/claude-agent-sdk,
# @modelcontextprotocol/sdk, electron-updater) get packed as node_modules.
appId: com.likeoffice.app
productName: LikeOffice
copyright: Copyright © 2026 LikeOffice contributors

directories:
  buildResources: build
  output: release

files:
  - out/**
  - resources/**

npmRebuild: false

# Ad-hoc sign the macOS bundle. Without this electron-builder ships Electron's
# own linker signature over a bundle it has since rewritten, and macOS calls
# the download "damaged" with no way past it. See build/after-pack.cjs.
afterPack: build/after-pack.cjs

fileAssociations:
  - ext: docx
    name: Word Document
    description: Word Document
    mimeType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
    role: Editor

mac:
  category: public.app-category.productivity
  # No `arch:` here ON PURPOSE. Pinning it in config OVERRIDES the CLI flag, so
  # `electron-builder --mac --arm64` still tried to build x64 as well. Each arch
  # must be built on a runner of that arch (#142), which means the caller
  # chooses: CI passes --arm64 / --x64, and a local `npm run dist:mac` builds
  # for this machine.
  target:
    - dmg
    - zip
  # Unsigned by default. Set CSC_LINK / CSC_KEY_PASSWORD to sign; see RELEASING.md.
  notarize: false

win:
  target:
    - nsis

linux:
  # electron-builder derives the executable name from package.json `name`,
  # which is the scoped "@likeoffice/desktop"; it sanitizes to
  # "@likeofficedesktop" and AppImage refuses the "@" outright, failing the
  # build. macOS and Windows never hit this because they name the binary from
  # productName. Set it explicitly for Linux only, so the verified mac bundle
  # layout (Contents/MacOS/LikeOffice) is untouched.
  executableName: likeoffice
  target:
    - AppImage
    - deb
  category: Office
  maintainer: LikeOffice contributors
  synopsis: High-fidelity .docx word processor

deb:
  # Default is "${name}_${version}_${arch}.${ext}", and ${name} is the scoped
  # "@likeoffice/desktop" — so the artifact path gained a "/" and a "@". Name
  # it from productName, as AppImage already does.
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: theRealestAEP
  repo: likeoffice
